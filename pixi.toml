[workspace]
name = "local_library_skills.git"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
jupyter = ">=1.0,<2"  # added by reporting init-quarto.py
quarto = ">=1.9,<2"  # added by reporting init-quarto.py
python = ">=3.10,<3.14"
numpy = ">=1.26,<3"
matplotlib = ">=3.8,<4"
scikit-learn = ">=1.4,<2"
xz = ">=5.8,<6"  # needed by `tar` for `quarto install tinytex`'s extraction step in this sandboxed container
pytest = ">=8,<9"  # unit tests for the skills' Python scripts - see python_unit_tests/
pyyaml = ">=6,<7"  # local-library's sync-quarto-pages.py imports it directly

[tasks]
test = "pytest"
