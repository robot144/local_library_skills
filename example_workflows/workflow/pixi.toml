[workspace]
name = "workflow"
version = "0.1.0"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10,<3.14"
snakemake-minimal = ">=8,<9"
# Swap to `snakemake = ">=8,<9"` instead if you need the extra reporting/
# plotting dependencies snakemake-minimal leaves out.
